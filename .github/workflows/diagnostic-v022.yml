name: Windows v0.2.2 Startup Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-latest
    env:
      MINDCORE_UPDATER_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify diagnostic source boundary
        shell: pwsh
        run: |
          python scripts/release_guard.py version --expected 0.2.2
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic source version must remain 0.2.2" }
          python -c "from app.database.schema_contract import CURRENT_TURSO_BASELINE_VERSION; from app.database.migrations import FORWARD_MIGRATIONS; assert CURRENT_TURSO_BASELINE_VERSION == '21'; assert FORWARD_MIGRATIONS.migrations == (); print('V022_SCHEMA_BOUNDARY_OK')"
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic schema boundary validation failed" }
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r desktop/requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -v
      - name: Compile Python sources
        run: python -m compileall -q app desktop
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Test updater build configurations
        working-directory: frontend
        run: npm run test:updater-config
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build and verify Windows sidecar archive
        working-directory: frontend
        shell: pwsh
        run: |
          npm run desktop:sidecar:build
          if ($LASTEXITCODE -ne 0) { throw "Sidecar build failed" }
          $sidecar = "src-tauri/binaries/mindcore-backend-x86_64-pc-windows-msvc.exe"
          if (!(Test-Path $sidecar)) { throw "Windows sidecar is missing" }
          & $sidecar --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Windows sidecar archive could not start" }
      - name: Run updater-disabled Rust tests
        working-directory: frontend/src-tauri
        run: cargo test --locked
      - name: Check updater-disabled Rust for Windows
        working-directory: frontend/src-tauri
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Build private updater-disabled diagnostic installer
        working-directory: frontend
        run: npm run tauri:build:windows
      - name: Validate and name diagnostic installer
        shell: pwsh
        run: |
          $bundle = "frontend/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter *.exe -Recurse | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -le 0) { throw "NSIS installer is missing or empty" }
          $diagnostic = Join-Path $bundle "MindCore_0.2.2_Diagnostic_Setup.exe"
          Move-Item $installer.FullName $diagnostic -Force
          $hash = (Get-FileHash $diagnostic -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *MindCore_0.2.2_Diagnostic_Setup.exe" | Set-Content "$diagnostic.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: MindCore-0.2.2-Startup-Diagnostic-Windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/MindCore_0.2.2_Diagnostic_Setup.exe
            frontend/src-tauri/target/release/bundle/nsis/MindCore_0.2.2_Diagnostic_Setup.exe.sha256
          if-no-files-found: error

name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      MINDCORE_UPDATER_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r desktop/requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -v
      - name: Compile Python sources
        run: python -m compileall -q app desktop
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Test updater build configurations
        working-directory: frontend
        run: npm run test:updater-config
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build Windows sidecar
        working-directory: frontend
        run: npm run desktop:sidecar:build
      - name: Run Rust tests
        working-directory: frontend/src-tauri
        run: cargo test
      - name: Check Rust for Windows
        working-directory: frontend/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Build unsigned Windows NSIS artifact
        working-directory: frontend
        run: npm run tauri:build:windows
      - name: Verify Windows sidecar and installer
        shell: pwsh
        run: |
          $sidecar = "frontend/src-tauri/binaries/mindcore-backend-x86_64-pc-windows-msvc.exe"
          $installer = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis" -Filter *.exe -Recurse | Select-Object -First 1
          if (!(Test-Path $sidecar)) { throw "Windows sidecar is missing" }
          if ($null -eq $installer -or $installer.Length -le 0) { throw "NSIS installer is missing or empty" }
          if ($env:GITHUB_REF_NAME -eq "diagnostic/v022-startup-progress") {
            & $sidecar --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Windows sidecar archive could not start" }
            $diagnostic = Join-Path $installer.DirectoryName "MindCore_0.2.2_Diagnostic2_Setup.exe"
            Move-Item $installer.FullName $diagnostic -Force
            $hash = (Get-FileHash $diagnostic -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *MindCore_0.2.2_Diagnostic2_Setup.exe" | Set-Content "$diagnostic.sha256" -NoNewline
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'diagnostic/v022-startup-progress' && 'MindCore-0.2.2-Startup-Diagnostic-2-Windows' || 'mindcore-windows-unsigned' }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/**
          if-no-files-found: error
